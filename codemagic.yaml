workflows:
  android-debug:
    name: Android Debug Build (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 21
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web bundle
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor to Android
        script: |
          cd frontend
          npx cap sync android
      - name: Build Android debug APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - chippewavalleyhomecare@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release AAB (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 21
      # Codemagic-managed keystore (Team settings -> Code signing identities ->
      # Android keystores). Codemagic decodes it to $CM_KEYSTORE_PATH and
      # provides CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD. The old
      # android_signing VAR GROUP hand-decoded a pasted base64 blob
      # (echo $CM_KEYSTORE | base64 --decode) and produced a corrupt file:
      # signReleaseBundle failed with "Tag number over 30 is not supported".
      # If the build says the reference below is not found, use the exact
      # reference name shown for the keystore in the Codemagic UI.
      android_signing:
        - cvhc_upload_key
      vars:
        PACKAGE_NAME: com.cvhc.homecare
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web bundle
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor to Android
        script: |
          cd frontend
          npx cap sync android
      - name: Set up release keystore
        script: |
          cd frontend/android
          cat <<EOF >> gradle.properties
          MYAPP_RELEASE_STORE_FILE=$CM_KEYSTORE_PATH
          MYAPP_RELEASE_KEY_ALIAS=$CM_KEY_ALIAS
          MYAPP_RELEASE_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_PASSWORD=$CM_KEY_PASSWORD
          EOF
      - name: Build Android release AAB
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - chippewavalleyhomecare@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment after creating a Google Play service account
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    # No named integration: the App Store Connect API key comes from the
    # appstore_credentials variable group on the app itself, so the build works
    # regardless of which Codemagic workspace it starts in. The group must
    # define: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
    # APP_STORE_CONNECT_PRIVATE_KEY (the .p8 contents). The codemagic CLI
    # (fetch-signing-files, get-latest-build-number) reads them automatically.
    environment:
      groups:
        - appstore_credentials
      node: 22.11.0
      xcode: latest
      vars:
        BUNDLE_ID: com.cvhc.homecare
        # Capacitor 8 uses SPM — there is no CocoaPods App.xcworkspace, only
        # the xcodeproj. build-ipa must target the project. Path is from the
        # repo root: the build step runs there so the IPA lands in build/ios/ipa.
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6785646689
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web bundle
        script: |
          cd frontend
          npm run build
      # Proven pattern from the working Ick pipeline: the native iOS project is
      # regenerated on the macOS builder EVERY build. cap add ios is not
      # idempotent, and a project scaffolded on Windows carries backslash SPM
      # paths in CapApp-SPM/Package.swift that macOS cannot resolve — which is
      # exactly how showBuildSettings died with exit 74.
      - name: Set up Capacitor iOS native project
        script: |
          cd frontend
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: cap add ios did not produce App.xcodeproj" >&2
            exit 1
          fi
      - name: Add Info.plist purpose strings
        script: |
          # The regenerated Info.plist has no permission purpose strings, and
          # Apple rejects binaries referencing location APIs without them
          # (ITMS-90683). Wording matches the store data-safety declarations.
          PLIST=frontend/ios/App/App/Info.plist
          plutil -replace NSLocationWhenInUseUsageDescription -string "CVHC HomeCare records your location only at clock-in and clock-out to verify your visit for Electronic Visit Verification (EVV). Your location is not tracked in the background." "$PLIST"
          plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "CVHC HomeCare uses your location only while you are using the app, at clock-in and clock-out, for Electronic Visit Verification (EVV). Background location tracking is not used." "$PLIST"
      - name: Resolve Swift Package dependencies
        script: |
          # Xcode resolves SPM automatically during build, but pre-resolving
          # makes failures legible — network/path issues surface here.
          cd frontend/ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App
      - name: Set up signing
        script: |
          keychain initialize
          # --certificate-key is REQUIRED without the Codemagic integration:
          # omitting it makes fetch-signing-files mint a certificate with a
          # throwaway key on the first build — every later VM then has no
          # private key for that cert, use-profiles silently applies nothing,
          # and the archive fails with "requires a provisioning profile".
          # CERTIFICATE_PRIVATE_KEY lives in the appstore_credentials group.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          # Fail HERE with a legible message if nothing usable was applied.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "--- fetched provisioning profiles ---"
          ls -la "$PROFILES_DIR" || true
          if [ -z "$(ls -A "$PROFILES_DIR" 2>/dev/null)" ]; then
            echo "ERROR: no provisioning profiles were fetched for $BUNDLE_ID" >&2
            exit 1
          fi
      - name: Increment build number
        script: |
          cd frontend/ios/App
          # First-ever upload: get-latest-build-number errors when the app has
          # zero builds in App Store Connect — default to 0 so build 1 goes out.
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in (''|*[!0-9]*) LATEST=0;; esac
          BUILD_NUMBER=$((LATEST + 1))
          echo "Using build number $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      # build-ipa writes to build/ios/ipa relative to where it is INVOKED
      # (repo root here), not next to the xcodeproj — the Ick pipeline hit
      # a silent "no IPAs found, TestFlight skipped" with the wrong glob.
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - chippewavalleyhomecare@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

workflows:
  android-debug:
    name: Android Debug Build (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 21
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web bundle
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor to Android
        script: |
          cd frontend
          npx cap sync android
      - name: Build Android debug APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - chippewavalleyhomecare@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release AAB (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.11.0
      java: 21
      # Codemagic-managed keystore (Team settings -> Code signing identities ->
      # Android keystores). Codemagic decodes it to $CM_KEYSTORE_PATH and
      # provides CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD. The old
      # android_signing VAR GROUP hand-decoded a pasted base64 blob
      # (echo $CM_KEYSTORE | base64 --decode) and produced a corrupt file:
      # signReleaseBundle failed with "Tag number over 30 is not supported".
      # If the build says the reference below is not found, use the exact
      # reference name shown for the keystore in the Codemagic UI.
      android_signing:
        - cvhc_upload_key
      vars:
        PACKAGE_NAME: com.cvhc.homecare
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web bundle
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor to Android
        script: |
          cd frontend
          npx cap sync android
      - name: Set up release keystore
        script: |
          cd frontend/android
          cat <<EOF >> gradle.properties
          MYAPP_RELEASE_STORE_FILE=$CM_KEYSTORE_PATH
          MYAPP_RELEASE_KEY_ALIAS=$CM_KEY_ALIAS
          MYAPP_RELEASE_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_PASSWORD=$CM_KEY_PASSWORD
          EOF
      - name: Build Android release AAB
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - chippewavalleyhomecare@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment after creating a Google Play service account
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Must match the App Store Connect API key's name in Codemagic
      # (Team settings -> Integrations -> App Store Connect) IN THE WORKSPACE
      # the build runs in. The first TestFlight build passed signing with this
      # name, so it exists in that workspace — a "does not exist" error means
      # the build was started from the app under a DIFFERENT workspace
      # (personal vs team); start it from the same app as the first build.
      app_store_connect: cvhc_app_store
    environment:
      node: 22.11.0
      xcode: latest
      vars:
        BUNDLE_ID: com.cvhc.homecare
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6785646689
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm ci
      - name: Build web bundle
        script: |
          cd frontend
          npm run build
      - name: Add iOS platform if missing
        script: |
          cd frontend
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor to iOS
        script: |
          cd frontend
          npx cap sync ios
      # No CocoaPods step: Capacitor 8 uses Swift Package Manager — there is no
      # Podfile, and `pod install` fails the build.
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd frontend/ios/App
          # First-ever upload: get-latest-build-number errors when the app has
          # zero builds in App Store Connect — default to 0 so build 1 goes out.
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in (''|*[!0-9]*) LATEST=0;; esac
          BUILD_NUMBER=$((LATEST + 1))
          echo "Using build number $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER
      - name: Build iOS app
        script: |
          cd frontend
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - chippewavalleyhomecare@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
